baseURL = "https://clutchski.github.io/theroadislife/"
locale = "en-US"
title = "The Road Is Life"
enableRobotsTXT = true
timeZone = "America/Toronto"
ignoreFiles = ["\\.json$", "pages/thank-you\\.md$", "archives/2005/09/latest_position\\.md$"]

[pagination]
  pagerSize = 7

[permalinks]
  archives = "/archives/:year/:month/:filename/"

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../extraction/content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "../extraction/photos"
    target = "static/photos"

[params]
  description = "A travel journal from the road, 2005–2007."
