{{- /* Site-root paths ("/photos/...") are rewritten relative to baseURL so images work under any base path. */ -}}
{{- $dest := .Destination -}}
{{- if and (strings.HasPrefix $dest "/") (not (strings.HasPrefix $dest "//")) -}}
  {{- $dest = strings.TrimPrefix "/" $dest | relURL -}}
{{- end -}}
<img src="{{ $dest | safeURL }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }}>
